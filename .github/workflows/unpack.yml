
name: Unpack project
on: workflow_dispatch
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack
        run: |
          unzip -q "$(ls *.zip | head -1)" -d _tmp
          rm -rf _tmp/body_atlas/.github
          cp -a _tmp/body_atlas/. .
          rm -rf _tmp *.zip
      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "Unpack project"
          git push
