name: Build Android App Bundle

on:
  workflow_dispatch:

env:
  APP_ORG: com.vitalearn

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project files
        run: flutter create --org "$APP_ORG" --project-name body_atlas --platforms android .

      - name: Get packages
        run: flutter pub get

      - name: App icons
        run: dart run flutter_launcher_icons

      - name: AdMob app ID and Android settings
        env:
          ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
        run: sh scripts/setup_android.sh "$ADMOB_APP_ID"

      - name: Set up signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
          {
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyPassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=${KEY_ALIAS:-upload}"
            echo "storeFile=upload-keystore.jks"
          } > android/key.properties
          python3 scripts/setup_signing.py

      - name: Disable code shrinking
        run: |
          if [ -f android/app/build.gradle.kts ]; then
            sed -i 's/signingConfig = signingConfigs.getByName("release")/signingConfig = signingConfigs.getByName("release")\n            isMinifyEnabled = false\n            isShrinkResources = false/' android/app/build.gradle.kts
            grep -n "isMinifyEnabled" android/app/build.gradle.kts
          fi
          if [ -f android/app/build.gradle ]; then
            sed -i 's/signingConfig signingConfigs.release/signingConfig signingConfigs.release\n            minifyEnabled false\n            shrinkResources false/' android/app/build.gradle
            grep -n "minifyEnabled" android/app/build.gradle
          fi      
         
      - name: Build app bundle and APK
        run: |
          flutter build appbundle --release
          flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: body-atlas-release
          path: |
            build/app/outputs/bundle/release/app-release.aab
            build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
