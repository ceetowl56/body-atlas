name: Build Android App Bundle

# Run it from the GitHub "Actions" tab: Build Android App Bundle > Run workflow.
on:
  workflow_dispatch:

env:
  # IMPORTANT: choose your own organisation name BEFORE the first release.
  # Your Play Store package name will be <APP_ORG>.body_atlas and it can
  # never be changed after you publish.
  APP_ORG: com.vitalearn

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project files
        run: flutter create --org "$APP_ORG" --project-name body_atlas --platforms android .

      - name: Get packages
        run: flutter pub get

      - name: App icons
        run: dart run flutter_launcher_icons

      - name: AdMob app ID and Android settings
        env:
          ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
        run: sh scripts/setup_android.sh "$ADMOB_APP_ID"

      - name: Set up signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
          {
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyPassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=${KEY_ALIAS:-upload}"
            echo "storeFile=upload-keystore.jks"
          } > android/key.properties
          python3 scripts/setup_signing.py

      - name: Analyze and test
        run: |
          flutter analyze || true
          flutter test || true

      - name: Build app bundle
        run: flutter build appbundle --release

      - uses: actions/upload-artifact@v4
        with:
          name: body-atlas-aab
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 30
