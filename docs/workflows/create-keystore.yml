name: Create upload keystore (run once)

# Run once from the GitHub "Actions" tab. It creates your Play upload key and
# puts it in a small artifact you download immediately (kept for 1 day).
# Then copy the values into GitHub Secrets (see docs/release_checklist.md)
# and keep a private backup of the keystore file.
on:
  workflow_dispatch:

jobs:
  keystore:
    runs-on: ubuntu-latest
    steps:
      - name: Generate keystore
        run: |
          PASS=$(openssl rand -hex 16)
          keytool -genkeypair -v -keystore upload-keystore.jks \
            -storetype JKS -alias upload -keyalg RSA -keysize 2048 \
            -validity 10000 -storepass "$PASS" -keypass "$PASS" \
            -dname "CN=Body Atlas, O=Body Atlas, C=US"
          mkdir out
          cp upload-keystore.jks out/
          base64 -w0 upload-keystore.jks > out/KEYSTORE_BASE64.txt
          echo -n "$PASS" > out/KEYSTORE_PASSWORD.txt
          echo -n "upload" > out/KEY_ALIAS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: upload-keystore-SECRET
          path: out/
          retention-days: 1
